<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">WACTGO Publisher</title>
  <desc id="desc">Light project card for a web publishing and content platform built with HTML, CSS, and JavaScript.</desc>
  <defs>

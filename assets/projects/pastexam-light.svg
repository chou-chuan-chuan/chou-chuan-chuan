<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">NTHU Physics Past Exam Platform</title>
  <desc id="desc">Light project card for a full-stack NTHU Physics past exam platform with search, preview, discussion, and deployment architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef7fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087c9f"/>
      <stop offset="1" stop-color="#6550c9"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d4e0ec" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:"Courier New", Courier, monospace}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="288" rx="14" fill="url(#bg)" stroke="#c7d7e8" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="288" rx="14" fill="url(#grid)" opacity="0.7"/>

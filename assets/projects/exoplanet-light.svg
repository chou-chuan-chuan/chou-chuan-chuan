<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">Exoplanet Transit Simulator</title>
  <desc id="desc">Light project card for an interactive exoplanet transit simulator with orbit controls and light curves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#eef7fb"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f0b441"/>
      <stop offset="1" stop-color="#f08a34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="38" y1="194" x2="278" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087c9f"/>
      <stop offset="1" stop-color="#6550c9"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d4e0ec" stroke-width="1"/>
    </pattern>
    <style>
      .ui{font-family:Segoe UI,Inter,Arial,sans-serif}
      .mono{font-family:Consolas,Menlo,monospace}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="288" rx="14" fill="url(#bg)" stroke="#c7d7e8" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="288" rx="14" fill="url(#grid)" opacity="0.7"/>
  <g transform="translate(52 40)">
    <circle cx="116" cy="86" r="62" fill="url(#star)"/>
    <circle cx="116" cy="86" r="41" fill="#f0b441" opacity="0.78"/>
    <ellipse cx="138" cy="86" rx="112" ry="40" fill="none" stroke="#9db0c3" stroke-width="1.4"/>
    <circle cx="190" cy="86" r="13" fill="#152033" stroke="#087c9f" stroke-width="2">
      <animate attributeName="cx" values="42;190;268;42" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path d="M38 194H278" stroke="#b7c7d7" stroke-width="1"/>
    <path d="M38 176C88 176 94 214 116 214S144 176 278 176" fill="none" stroke="url(#curve)" stroke-width="3" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
      <animate attributeName="stroke-dashoffset" values="360;0;0" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <text class="mono" x="38" y="225" font-size="11" fill="#58708b">normalized flux</text>
  </g>
  <g transform="translate(360 56)">
    <text class="mono" x="0" y="0" font-size="13" fill="#58708b">02 / Selected Work</text>
    <text class="ui" x="0" y="46" font-size="34" font-weight="700" fill="#142033">Exoplanet Transit Simulator</text>
    <text class="ui" x="0" y="82" font-size="16" fill="#405770">Interactive transit modeling with orbital parameters,</text>
    <text class="ui" x="0" y="106" font-size="16" fill="#405770">radius ratio, inclination, limb darkening, and sampling.</text>
    <g class="ui" font-size="12" font-weight="600">
      <rect x="0" y="134" width="96" height="26" rx="13" fill="#edf6fb" stroke="#c0d4e3"/>
      <text x="48" y="152" text-anchor="middle" fill="#29465f">Astrophysics</text>
      <rect x="108" y="134" width="116" height="26" rx="13" fill="#edf6fb" stroke="#c0d4e3"/>
      <text x="166" y="152" text-anchor="middle" fill="#29465f">Transit Modeling</text>
      <rect x="236" y="134" width="92" height="26" rx="13" fill="#edf6fb" stroke="#c0d4e3"/>
      <text x="282" y="152" text-anchor="middle" fill="#29465f">Light Curves</text>
      <rect x="340" y="134" width="152" height="26" rx="13" fill="#edf6fb" stroke="#c0d4e3"/>
      <text x="416" y="152" text-anchor="middle" fill="#29465f">Scientific Visualization</text>
    </g>
    <text class="mono" x="0" y="198" font-size="14" fill="#16875f">JavaScript · Canvas API · Numerical Simulation</text>
  </g>
</svg>

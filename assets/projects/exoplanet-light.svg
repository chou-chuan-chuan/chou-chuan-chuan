<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Exoplanet Transit Simulator</title>
  <desc id="desc">A project card with a small transit sketch, light curve, project description, and technologies.</desc>
  <defs>
    <style>
      .ui{font-family:"Segoe UI",Arial,sans-serif}
      .mono{font-family:Consolas,"Courier New",monospace}
    </style>
  </defs>

  <rect x=".5" y=".5" width="899" height="279" rx="6" fill="#f1f0e9" stroke="#d3d2c8"/>
  <path d="M304 30V250" stroke="#d3d2c8"/>

  <g transform="translate(42 36)">
    <ellipse cx="118" cy="75" rx="108" ry="36" transform="rotate(-7 118 75)" fill="none" stroke="#8e9fa0" stroke-width="1.2"/>
    <circle cx="102" cy="75" r="38" fill="#c5a15f"/>
    <circle cx="102" cy="75" r="27" fill="none" stroke="#a27a3f" opacity=".65"/>
    <circle cx="208" cy="62" r="10" fill="#354043">
      <animate attributeName="cx" values="18;208;236;18" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M14 161V208H236" fill="none" stroke="#aaa99f"/>
    <path d="M14 174C64 174 79 175 91 182C101 188 102 201 116 201C130 201 131 188 141 182C154 175 179 174 236 174" fill="none" stroke="#607f83" stroke-width="2.3" stroke-linecap="round"/>
    <text class="mono" x="17" y="228" font-size="11" fill="#707879">normalized flux</text>
    <path d="M224 28l10 3M230 23l-2 11" stroke="#9c6c57" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <g transform="translate(342 0)">
    <text class="mono" x="0" y="44" font-size="13" fill="#647b7d">astrophysics / interactive model</text>
    <text class="ui" x="0" y="86" font-size="34" font-weight="650" fill="#282d2e">Exoplanet Transit</text>
    <text class="ui" x="0" y="123" font-size="34" font-weight="650" fill="#282d2e">Simulator</text>
    <text class="ui" x="0" y="160" font-size="17" fill="#535b5c">Adjust orbital and stellar parameters, then compare</text>
    <text class="ui" x="0" y="184" font-size="17" fill="#535b5c">the transit animation with its light curve.</text>
    <path d="M0 207H510" stroke="#d3d2c8"/>
    <text class="mono" x="0" y="236" font-size="15" fill="#68797b">JavaScript · Canvas API · numerical simulation</text>
  </g>
</svg>
